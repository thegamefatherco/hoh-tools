name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint & format (Ultracite)
        run: bun run check

      - name: Type-check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Tag releases call this workflow too; release.yml builds and attaches their zips.
      - name: Package extension (Chrome & Firefox)
        id: package
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        working-directory: apps/extension
        env:
          NODE_ENV: production
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          rm -f .output/*.zip
          bun run zip
          bun run zip:firefox
          rm -f .output/*-sources.zip
          SHORT_SHA="${SHA::7}"
          mv .output/*-chrome.zip ".output/hoh-tools-${SHORT_SHA}-chrome.zip"
          mv .output/*-firefox.zip ".output/hoh-tools-${SHORT_SHA}-firefox.zip"
          ls -la .output/*.zip
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload Chrome extension
        id: upload-chrome
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: extension-chrome
          path: apps/extension/.output/*-chrome.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Firefox extension
        id: upload-firefox
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: extension-firefox
          path: apps/extension/.output/*-firefox.zip
          if-no-files-found: error
          retention-days: 14

      # Fork PRs get a read-only token, so they keep the artifacts on the run without a comment.
      - name: Comment extension builds on the PR
        if: >-
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.upload-chrome.outcome == 'success' && steps.upload-firefox.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CHROME_URL: ${{ steps.upload-chrome.outputs.artifact-url }}
          FIREFOX_URL: ${{ steps.upload-firefox.outputs.artifact-url }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
          FULL_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        with:
          script: |
            const marker = "<!-- extension-builds -->";
            const { CHROME_URL, FIREFOX_URL, SHORT_SHA, FULL_SHA, BRANCH } = process.env;
            const { owner, repo } = context.repo;
            const serverUrl = context.serverUrl;
            const runUrl = `${serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const commitUrl = `${serverUrl}/${owner}/${repo}/commit/${FULL_SHA}`;

            const body = [
              marker,
              "### Extension builds",
              "",
              `Built from [\`${SHORT_SHA}\`](${commitUrl}) on \`${BRANCH}\` ([workflow run](${runUrl})).`,
              "",
              "| Browser | Download |",
              "| --- | --- |",
              `| Chrome / Edge | [extension-chrome](${CHROME_URL}) |`,
              `| Firefox | [extension-firefox](${FIREFOX_URL}) |`,
              "",
              "GitHub wraps each artifact in its own zip; the extension zip is inside it.",
              "",
              "- **Chrome / Edge:** unzip the inner `hoh-tools-*-chrome.zip`, open `chrome://extensions`, enable Developer mode, then *Load unpacked* and pick the unzipped folder.",
              "- **Firefox:** open `about:debugging#/runtime/this-firefox`, *Load Temporary Add-on…*, and pick the inner `hoh-tools-*-firefox.zip`.",
              "",
              "Artifacts expire 14 days after the run. This comment is updated on every successful CI run.",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body,
              });
            }
