# Releases every app affected since the previous `vX.Y.Z` tag.
#
# 1. Bump "version" in the root package.json, commit.
# 2. Tag the commit `vX.Y.Z` (must match that version) and push the tag.
#
# Affected apps are computed with Turborepo's dependency graph, so a change in a shared
# package (e.g. packages/negotiation) releases every app that depends on it. The first tag
# (no previous `v*` tag) releases everything. Run the workflow manually from a tag ref with
# `force_all` to re-release every app.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_all:
        description: Release every app, regardless of what changed.
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  changes:
    name: Detect affected apps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      extension: ${{ steps.affected.outputs.extension }}
      web: ${{ steps.affected.outputs.web }}
      docs: ${{ steps.affected.outputs.docs }}
      native: ${{ steps.affected.outputs.native }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Verify tag matches package.json version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow from a vX.Y.Z tag, not a branch."
            exit 1
          fi
          VERSION="$(jq -r .version package.json)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION (expected v$VERSION)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute affected apps
        id: affected
        env:
          FORCE_ALL: ${{ inputs.force_all || false }}
          TAG: ${{ github.ref_name }}
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"

          if [ "$FORCE_ALL" = "true" ] || [ -z "$PREVIOUS_TAG" ]; then
            echo "Releasing every app (force_all=$FORCE_ALL, previous tag='${PREVIOUS_TAG}')."
            AFFECTED='["extension","web","fumadocs","native"]'
          else
            echo "Comparing $PREVIOUS_TAG...$TAG"
            AFFECTED="$(bunx turbo ls --filter="...[$PREVIOUS_TAG...$TAG]" --output=json | jq -c '[.packages.items[].name]')"
          fi
          echo "Affected packages: $AFFECTED"

          has() { echo "$AFFECTED" | jq -e --arg p "$1" 'index($p) != null' > /dev/null && echo true || echo false; }
          {
            echo "extension=$(has extension)"
            echo "web=$(has web)"
            echo "docs=$(has fumadocs)"
            echo "native=$(has native)"
          } | tee -a "$GITHUB_OUTPUT"

  github-release:
    name: GitHub Release
    needs: [ci, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  extension:
    name: Extension (zips)
    needs: [changes, github-release]
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Stamp release version into the extension manifest
        working-directory: apps/extension
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Build Chrome & Firefox zips
        working-directory: apps/extension
        env:
          NODE_ENV: production
        run: |
          bun run zip
          bun run zip:firefox
          ls -la .output/*.zip

      - name: Attach zips to the release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/extension/.output/*.zip

      - name: Keep zips for store submission
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: apps/extension/.output/*.zip
          retention-days: 7

  extension-stores:
    name: Extension (store submission)
    needs: [extension]
    # Opt-in: set the repository variable SUBMIT_EXTENSION_TO_STORES=true once store secrets exist.
    if: vars.SUBMIT_EXTENSION_TO_STORES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download zips
        uses: actions/download-artifact@v4
        with:
          name: extension-zips
          path: apps/extension/.output

      - name: Submit to Chrome Web Store & Firefox Add-ons
        working-directory: apps/extension
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          bunx wxt submit \
            --chrome-zip .output/*-chrome.zip \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip

  web:
    name: Web (Cloudflare)
    needs: [ci, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build (prerendered static site)
        env:
          NODE_ENV: production
        run: bun run build --filter=web

      - name: Deploy static assets
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

  docs:
    name: Docs (Cloudflare)
    needs: [ci, changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        env:
          NODE_ENV: production
        run: bun run build --filter=fumadocs

      - name: Deploy static assets
        working-directory: apps/fumadocs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

  native:
    name: Native (EAS build)
    needs: [ci, changes]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Queue iOS & Android production builds
        working-directory: apps/native
        run: eas build --platform all --profile production --non-interactive --no-wait
